name: Build No Net APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        run: |
          echo "Repository files:"
          ls -la
          find . -maxdepth 4 \( -name gradlew -o -name build.gradle -o -name build.gradle.kts \)

      - name: Build APK
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle project files are missing from the repository root."
            exit 1
          fi
